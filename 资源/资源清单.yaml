  zh: 字节跳动的大模型平台，可以调用豆包、Seedream 等模型的接口。
  en: ByteDance's model platform, with APIs for Doubao, Seedream and more.

- id: trae
  name: TRAE
  url: https://www.trae.cn
  category: 开发工具
  zh: 字节跳动的 AI 编程工具，打开项目文件夹就能看文件、改代码。
  en: ByteDance's AI coding tool. Open a project folder to read files and edit code.

- id: github
  name: GitHub
  url: https://github.com
  category: 开发工具
  zh: 存放代码的网站。这个博客就免费放在它的 GitHub Pages 上。
  en: Where code lives. This blog is hosted for free on its GitHub Pages.

- id: nodejs
