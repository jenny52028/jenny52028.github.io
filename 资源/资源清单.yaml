# 资源中心的资源清单
#
# 加一条新资源：复制下面任意一条（从 "- id:" 开始到 en 那一行），粘贴到最后，然后改内容。
#   id：英文小写、不重复，比如 my-tool
#   name：名称
#   url：网址，要带 https://
#   category：只能填 AI 工具 / 开发工具 / 学习资料 其中之一
#   zh：中文一句话介绍
#   en：英文一句话介绍（不会写可以先空着，跟赛博说一声帮你翻译）
# 注意：每行开头的空格要和上面对齐，冒号后面留一个空格。
# 顺序：网站上按这个文件里的先后顺序显示。

- id: codex
  name: Codex
  url: https://openai.com/codex/
  category: AI 工具
  zh: OpenAI 打造的 AI 编程助手，能读懂项目、改代码、运行命令，ChatGPT 付费套餐里就包含。
  en: OpenAI's AI coding agent. It reads projects, edits code and runs commands, and comes with paid ChatGPT plans.

- id: claude
  name: Claude
  url: https://claude.ai
  category: AI 工具
  zh: Anthropic 做的 AI 助手，这个博客就是和它一起做出来的。
  en: Anthropic's AI assistant. This blog was built together with it.

- id: deepseek
  name: DeepSeek
  url: https://www.deepseek.com
  category: AI 工具
  zh: 国产 AI 助手，中文对话流畅，网页版免费就能用。
  en: A Chinese AI assistant that's fluent in Chinese and free to use on the web.

- id: volcengine-ark
  name: 火山方舟
  url: https://www.volcengine.com/product/ark
