  zh: 很多网站工具运行时都要用到它，可以理解成搭网站的发动机。
  en: Many website tools run on it. Think of it as the engine for building sites.

- id: astro
  name: Astro
  url: https://astro.build
  category: 开发工具
  zh: 专门做内容网站的免费工具，写好 Markdown 文章就能生成博客。
  en: A free tool for content sites. Write Markdown and it builds the blog for you.

- id: github-docs
  name: GitHub 中文文档
  url: https://docs.github.com/zh
  category: 学习资料
  zh: GitHub 官方帮助文档的中文版，建仓库、发布网站都有教程。
  en: GitHub's official docs in Chinese, with guides on repositories and Pages.

- id: astro-docs
  name: Astro 中文文档
  url: https://docs.astro.build/zh-cn/getting-started/
  category: 学习资料
  zh: Astro 官方教程的中文版，想自己改博客样子时可以查。
  en: Astro's official docs in Chinese, handy when you want to change the blog yourself.

- id: markdown-basics
  name: Markdown 基本语法
  url: https://markdown.com.cn/basic-syntax/
  category: 学习资料
  zh: 用例子讲清楚标题、列表、加粗、图片怎么写，写文章前看一遍就够。
  en: Headings, lists, bold and images explained with examples. One read is enough to start writing.
